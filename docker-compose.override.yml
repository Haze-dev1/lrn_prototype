# Development overrides, merged automatically by `docker compose up`.
#
# This file only ADDS to docker-compose.yml — source mounts, hot reload, and loopback-bound
# datastore ports. Compose cannot remove a list entry a base file declared, so production safety
# depends on the base file never containing development configuration in the first place.
#
# Production explicitly excludes this file:  docker compose -f docker-compose.yml up -d --build

services:
  web:
    build:
      target: dev
    environment:
      NODE_ENV: development
      # Bind mounts on some filesystems do not deliver inotify events reliably.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./web:/app
      # Anonymous volumes keep the image's installed dependencies and build cache from being
      # shadowed by the host directory.
      - /app/node_modules
      - /app/.next

  api:
    command: uvicorn core.apis.api:app --host 0.0.0.0 --port 8000 --reload
    # Run as the host user so files written into the bind mount — an autogenerated Alembic
    # revision, for example — are owned by the developer rather than the image's uid 1001.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./backend:/app

  scheduler:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./backend:/app

  postgres:
    ports:
      # Loopback only: reachable from local tooling on this machine, never from the network.
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"
